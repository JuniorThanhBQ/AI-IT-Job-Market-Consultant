<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2>Celery Task Execution Report</h2>
    <hr/>
    <p><strong>Task Name:</strong> {{ task_name }}</p>
    <p><strong>Task ID:</strong> {{ task_id }}</p>
    <p><strong>Status:</strong> <span style="color: {{ status_color }}; font-weight: bold;">{{ state }}</span></p>
    <p><strong>Arguments:</strong> {{ args }}</p>
    <p><strong>Start Time:</strong> {{ time_start }}</p>
    <p><strong>End Time:</strong> {{ time_end }}</p>
    <p><strong>Run Duration:</strong> {{ run_duration }}</p>
    {% if error_info %}
    <h3>Error Exception Details:</h3>
    <pre style="background: #fff0f0; border-left: 4px solid #f44336; padding: 10px; font-family: monospace;">{{ error_info }}</pre>
    {% endif %}
</body>
</html>
