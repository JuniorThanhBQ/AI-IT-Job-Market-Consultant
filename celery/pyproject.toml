[project]
name = "celery-app"
version = "1.0.0"
description = "Celery background worker and scheduler for IT Job Market Consultant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.4.0",
    "redis>=8.1.0",
    "crawlee[all]>=1.8.3",
    "crawl4ai>=0.9.2",
    "aiohttp>=3.14.3",
    "sqlmodel>=0.0.22",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
    "sentry-sdk>=2.65.0",
    "google-genai>=2.16.0",
    "jinja2>=3.1.4",
    "emails>=0.6",
    "email-validator>=2.3.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "psycopg[binary]>=3.3.4",
    "asyncpg>=0.30.0",
    "pyjwt>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
