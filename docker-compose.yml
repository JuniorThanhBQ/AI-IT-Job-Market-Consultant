services:

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      backend-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - PYTHONPATH=/app/backend
    secrets:
      - postgres_password
      - secret_key
      - first_superuser_password
      - smtp_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-init:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - PYTHONPATH=/app/backend
    secrets:
      - postgres_password
      - secret_key
      - first_superuser_password
      - smtp_password
    command: >
      sh -c "alembic -c database/alembic.ini upgrade head && python app/fixtures/initial_data.py"

  nginx:
    image: nginx:stable-alpine3.24-slim@sha256:ddde39c6e51f02fde7410c2e9c234cf2d0a4c7bdbbe176aeb37d8ad7ab4eb58c
    networks:
      - frontend
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
        restart: true

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  db:
    image: pgvector/pgvector:0.8.5-pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - backend
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
    secrets:
      - postgres_password

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: app-rabbitmq
    networks:
      - backend
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    image: '${DOCKER_IMAGE_CELERY?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: app-celery-worker
    command: ["celery", "-A", "agents.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/backend:/app
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    secrets:
      - postgres_password
      - secret_key

  celery-beat:
    image: '${DOCKER_IMAGE_CELERY?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: app-celery-beat
    command: ["celery", "-A", "agents.celery_app", "beat", "--loglevel=info"]
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/backend:/app
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    secrets:
      - postgres_password
      - secret_key

volumes:
  app-db-data:

networks:
  frontend:
    name: frontend-network

  backend:
    name: app-internal-network
    driver: bridge
    internal: true

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  secret_key:
    environment: SECRET_KEY
  first_superuser_password:
    environment: FIRST_SUPERUSER_PASSWORD
  smtp_password:
    environment: SMTP_PASSWORD
