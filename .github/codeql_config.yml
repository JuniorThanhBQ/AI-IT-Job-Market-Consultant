name: "CodeQL configuration"

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  - exclude:
      problem.severity:
        - recommendation
        - low

paths:
  - backend
  - frontend

paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/.next/**'
  - '**/build/**'
  - '**/*.min.js'
  - '**/tests/**'
  - '**/test/**'
  - '**/__pycache__/**'
  - '**/migrations/**'
  - '**/.venv/**'
  - '**/venv/**'
