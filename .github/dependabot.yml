version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal, github_actions]
    groups:
      actions-all:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "JuniorThanhBQ"
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "JuniorThanhBQ"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆"
    labels:
      - dependencies
      - internal
    groups:
      nextjs-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "JuniorThanhBQ"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Asia/Ho_Chi_Minh"
    assignees:
      - "JuniorThanhBQ"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    directories:
      - /backend
      - /frontend
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Asia/Ho_Chi_Minh"
    commit-message:
      prefix: ⬆
    groups:
      docker:
        patterns:
          - "*"
    assignees:
      - "JuniorThanhBQ"

  - package-ecosystem: docker-compose
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Asia/Ho_Chi_Minh"
    commit-message:
      prefix: ⬆
    groups:
      docker-compose:
        patterns:
          - "*"
    assignees:
      - "JuniorThanhBQ"
