name: Lint Workflow

on:
  workflow_call:

concurrency:
  group: lint-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-backend:
    name: Lint Backend (Pylint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "latest"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run Pylint
        run: uv run --with pylint pylint backend/app/ --fail-under=8.0 || true

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true


  lint-docker-compose:
    name: Lint Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Docker Compose files
        id: detect-compose
        run: bash scripts/compose/detect-compose.sh

      - name: Validate Docker Compose Syntax
        if: steps.detect-compose.outputs.has_compose == 'true'
        env:
          COMPOSE_FILES: ${{ steps.detect-compose.outputs.compose_files }}
        run: bash scripts/compose/validate-compose.sh

      - name: Setup Python for Compose Lint
        if: steps.detect-compose.outputs.has_compose == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Compose Lint (Security & Best Practices)
        if: steps.detect-compose.outputs.has_compose == 'true'
        env:
          COMPOSE_FILES: ${{ steps.detect-compose.outputs.compose_files }}
        run: bash scripts/compose/compose-lint.sh || true
