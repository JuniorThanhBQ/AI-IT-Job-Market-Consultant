name: Lint Workflow

on:
  workflow_call:

concurrency:
  group: lint-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-backend:
    name: Lint Backend (Pylint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true
          version: "latest"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run Pylint
        run: uv run --with pylint pylint backend/app/ --fail-under=8.0 || true

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true


  lint-docker-compose:
    name: Lint Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Detect Docker Compose files
        id: detect-compose
        run: bash scripts/compose/detect-compose.sh

      - name: Validate Docker Compose Syntax
        if: steps.detect-compose.outputs.has_compose == 'true'
        env:
          COMPOSE_FILES: ${{ steps.detect-compose.outputs.compose_files }}
        run: bash scripts/compose/validate-compose.sh

      - name: Setup Python for Compose Lint
        if: steps.detect-compose.outputs.has_compose == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Compose Lint (Security & Best Practices)
        if: steps.detect-compose.outputs.has_compose == 'true'
        env:
          COMPOSE_FILES: ${{ steps.detect-compose.outputs.compose_files }}
        run: bash scripts/compose/compose-lint.sh || true
