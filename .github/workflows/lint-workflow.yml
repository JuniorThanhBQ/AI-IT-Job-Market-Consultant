name: Lint Workflow

on:
  workflow_call:

concurrency:
  group: lint-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-backend:
    name: Lint Backend (Pylint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "latest"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run Pylint
        run: uv run --with pylint pylint backend/app/ --fail-under=8.0 || true

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true


  lint-docker-compose:
    name: Lint Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Docker Compose Syntax
        run: |
          [ -f .env ] || cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Checkov Compose Security Scan
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085
        with:
          args: -f docker-compose.yml -f docker-compose.prod.yml
          framework: yaml
          output_format: cli
