name: Staging branch deployment workflow

on:
  workflow_dispatch:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: deploy-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  ci-pipeline:
    name: Run CI Pipeline
    uses: ./.github/workflows/full-ci-commit-workflow.yml

  test-staging:
    name: Test Docker Build and Run
    needs: ci-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Create Environment Config
        run: bash scripts/create_staging_env.sh

      - name: Build Docker Stack
        run: docker compose build

      - name: Scan Backend Image Security (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ai-it-job-market-consultant-backend:latest'
          scan-type: 'image'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

      - name: Scan Frontend Image Security (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ai-it-job-market-consultant-frontend:latest'
          scan-type: 'image'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

      - name: Scan Celery Image Security (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ai-it-job-market-consultant-celery:latest'
          scan-type: 'image'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Verify Container Health
        run: bash scripts/verify_container_health.sh

      - name: Stop Docker Stack
        if: always()
        run: docker compose down -v
