repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^notebooks/
      - id: check-merge-conflict
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # frozen: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea  # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|json)$

  - repo: local
    hooks:
      - id: local-ruff-check
        name: ruff check
        entry: uv run --package backend ruff check --config backend/pyproject.toml --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run --package backend ruff format --config backend/pyproject.toml --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: system
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: uv run --package backend mypy backend/app
        require_serial: true
        language: system
        pass_filenames: false

      - id: frontend-lint-typecheck
        name: ESLint
        entry: npm --prefix frontend run lint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/bridgecrewio/checkov
    rev: e40023ab262c7c8b7b0a8f0975072b42d1b601f9  # frozen: 3.3.29
    hooks:
      - id: checkov
        name: Checkov Docker Compose Lint
        files: ^(docker-)?compose(\..+)?\.ya?ml$
        args:
          - --framework
          - yaml

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: ["--min-severity", "high"]
