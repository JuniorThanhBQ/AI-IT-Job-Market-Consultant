repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-added-large-files
        exclude: ^notebooks/
      - id: check-merge-conflict
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0  # frozen: v1.48.0
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|json)$

  - repo: local
    hooks:
      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: system
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: uv run mypy backend/app
        require_serial: true
        language: system
        pass_filenames: false

      - id: frontend-lint-typecheck
        name: Frontend Linter & Type Check (ESLint)
        entry: npm --prefix frontend run lint
        language: system
        types_or: [javascript, jsx]
        pass_filenames: false

      - id: add-release-date
        name: Add date to latest release header
        entry: uv run python scripts/add_latest_release_date.py
        language: system
        files: ^release-notes\.md$
        pass_filenames: false

      - id: pytest-backend
        name: Run Backend Unit Tests
        entry: uv run --project backend pytest -m "not e2e"
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.9
    hooks:
      - id: checkov
        name: Checkov Docker Compose Lint
        files: ^(docker-)?compose(\..+)?\.ya?ml$
        args:
          - --framework
          - yaml

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: ["--min-severity", "high"]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
