services:
  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    working_dir: /app/backend
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      backend-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT?Variable not set}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - PYTHONPATH=/app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 5

  backend-init:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    working_dir: /app/backend
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ../.env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - PYTHONPATH=/app/backend
    command: alembic -c database/alembic.ini upgrade head

  nginx:
    image: nginx:stable-alpine3.24-slim@sha256:ddde39c6e51f02fde7410c2e9c234cf2d0a4c7bdbbe176aeb37d8ad7ab4eb58c
    networks:
      - frontend
    ports:
      - "80:80"
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  db:
    image: pgvector/pgvector:0.8.6-pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
    container_name: app-db
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - server-app-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - backend
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  rabbitmq:
    image: rabbitmq:3.13-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: app-rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      start_period: 5s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER?Variable not set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD?Variable not set}

  celery-worker-default:
    image: '${DOCKER_IMAGE_CELERY?Variable not set}:${TAG-latest}'
    container_name: app-celery-worker-default
    command: ["/app/celery_app/scripts/start_worker.sh", "-Q", "celery"]
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/backend:/app/celery_app
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - RABBITMQ_SERVER=${RABBITMQ_SERVER?Variable not set}
      - RABBITMQ_PORT=${RABBITMQ_PORT?Variable not set}
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - RCLONE_CONFIG=/app/celery_app/rclone.conf
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD-50}
      - SMTP_HOST=${SMTP_HOST?Variable not set}
      - SMTP_USER=${SMTP_USER?Variable not set}
      - SMTP_PASSWORD=${SMTP_PASSWORD?Variable not set}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL?Variable not set}
      - SMTP_PORT=${SMTP_PORT?Variable not set}
      - SMTP_TLS=${SMTP_TLS?Variable not set}
    volumes:
      - ./rclone.conf:/app/celery_app/rclone.conf:ro

  celery-worker-crawler:
    image: '${DOCKER_IMAGE_CELERY?Variable not set}:${TAG-latest}'
    container_name: app-celery-worker-crawler
    command: ["/app/celery_app/scripts/start_worker.sh", "-Q", "crawler"]
    shm_size: '1gb'
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/backend:/app/celery_app
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - RABBITMQ_SERVER=${RABBITMQ_SERVER?Variable not set}
      - RABBITMQ_PORT=${RABBITMQ_PORT?Variable not set}
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - RCLONE_CONFIG=/app/celery_app/rclone.conf
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD-50}
      - CELERY_WORKER_CONCURRENCY=1
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_TLS=${SMTP_TLS}

  celery-beat:
    image: '${DOCKER_IMAGE_CELERY?Variable not set}:${TAG-latest}'
    container_name: app-celery-beat
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/backend:/app/celery_app
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - RABBITMQ_SERVER=${RABBITMQ_SERVER?Variable not set}
      - RABBITMQ_PORT=${RABBITMQ_PORT?Variable not set}
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - RCLONE_CONFIG=/app/celery_app/rclone.conf
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD-50}
    volumes:
      - server-celery-beat-data:/var/run/celery
    healthcheck:
      disable: true
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info", "-s", "/var/run/celery/celerybeat-schedule"]

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: app-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    networks:
      - backend
    volumes:
      - server-redis-data:/data

  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: app-ngrok
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      nginx:
        condition: service_started
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN?Variable not set}
    command:
      - "http"
      - "nginx:80"
    ports:
      - "4040:4040"

  adminer:
    restart: "no"
    image: adminer:5.5.0-standalone@sha256:a1e730bf95a18f1d7c38b409ab58a39d57d07bdb090614b81f5c7b37c6021b96
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    networks:
      - backend
      - frontend

volumes:
  server-app-db-data:
  server-redis-data:
  server-celery-beat-data:

networks:
  frontend:
    name: server-frontend-network

  backend:
    name: server-app-internal-network
    driver: bridge
    internal: true
