[project]
name = "ai-it-job-market-consultant"
version = "0.1.0"
description = "AI IT Jobs Market Consultant platform used UV to manage Python packages. The reason to use UV is that it has a nice CLI UI, is easy to learn, and has a management package using pyproject.toml"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[tool.uv.workspace]
members = [
    "backend",
    "celery",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend", "celery"]

[tool.mypy]
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "crawl4ai.*",
    "crawlee.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery_app"
ignore_errors = true
