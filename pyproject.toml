[project]
name = "ai-it-job-market-consultant"
version = "1.1.0"
description = "AI IT Jobs Market Consultant platform used UV to manage Python packages. The reason to use UV is that it has management CLI, easy to learn and has a package version control using pyproject.toml"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.uv.workspace]
members = [
    "backend",
    "celery_app",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend", "celery_app"]

[tool.mypy]
exclude = ["venv", ".venv", "alembic"]
ignore_missing_imports = true

[tool.app-security-audit.trivy]
scanners = ["vuln", "misconfig"]
severity = ["HIGH", "CRITICAL"]
timeout = "15m"
skip-dirs = [
    "**/.venv", "**/venv", "**/node_modules", "**/.next",
    "**/__pycache__", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache",
]

[tool.app-security-audit.semgrep]
severity = ["ERROR"]
exclude = ["*.ipynb"]
rules = ["p/security-audit", "p/secrets", "p/owasp-top-ten", "p/python", "p/javascript", "p/typescript"]

[tool.app-security-audit.zap]
fail-on = "MEDIUM"

[tool.app-security-audit.npm]
audit-level = "critical"
