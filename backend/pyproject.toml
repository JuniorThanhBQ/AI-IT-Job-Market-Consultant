[project]
name = "backend"
version = "1.0.0"
description = "AI IT Jobs Market Consultant platform used UV to manage backend packages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "emails>=0.6",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "langgraph",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "sqladmin[full]>=0.31.0",
    "sqlmodel>=0.0.22",
    "tenacity>=9.1.4",
    "langchain>=1.3.14",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.21",
    "typos>=1.48.0",
    "pylint>=4.0.6",
    "radon>=6.0.1",
    "bandit>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = "celery.*,crawl4ai.*,crawlee.*,rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery_app.tests.*"
ignore_errors = true



[tool.ruff]
target-version = "py314"
exclude = ["alembic", "**/models.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["T201"]
"scripts/*.py" = ["T201"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents"]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
testpaths = ["tests"]


[tool.pylint.messages_control]
disable = [
    "all",
]
enable = [
    "duplicate-code",
    "cyclic-import",
]

[tool.pylint.similar]
min-similarity-lines = 80
ignore-comments = "yes"
ignore-docstrings = "yes"
ignore-imports = "yes"
ignore-signatures = "yes"

[tool.radon]
cc_min = "B"
show_complexity = true
show_closures = true
mi_min = "B"
show_mi = true

[tool.bandit]
exclude_dirs = ["tests", "test"]
