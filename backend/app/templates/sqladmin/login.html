{% extends "sqladmin/base.html" %}

{% block head_tail %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block body %}
<div class="login-container">
  <div class="login-card card">
    <div class="card-body">
      <h1 class="login-title">{{ admin.title }}</h1>

      {% if error %}
      <div class="alert alert-danger mb-3" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
        <div class="mb-3">
          <label class="form-label" for="username">{{ _("Email / Username") }}</label>
          <input
            id="username"
            name="username"
            type="text"
            class="form-control {% if error %}is-invalid{% endif %}"
            placeholder="{{ _('Enter your email') }}"
            required
            autofocus
            autocomplete="username"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">{{ _("Password") }}</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control {% if error %}is-invalid{% endif %}"
            placeholder="{{ _('Enter your password') }}"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100">
            {{ _("Login") }}
          </button>
        </div>
      </form>

      <a href="/" class="back-link">&larr; {{ _("Back to application") }}</a>
    </div>
  </div>
</div>
{% endblock %}
